name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Prepare release directory
        run: mkdir -p dist

      - name: Build Linux amd64
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: >-
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath
          -ldflags="-s -w -X pmjira/internal/web.AppVersion=${RELEASE_VERSION}"
          -o dist/pmdesk-linux-amd64 .

      - name: Build Windows amd64 console
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: >-
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath
          -ldflags="-s -w -X pmjira/internal/web.AppVersion=${RELEASE_VERSION}"
          -o dist/pmdesk-windows-amd64.exe .

      - name: Build Windows amd64 GUI
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: >-
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath
          -ldflags="-s -w -H windowsgui -X main.guiBuild=true -X pmjira/internal/web.AppVersion=${RELEASE_VERSION}"
          -o dist/pmdesk-windows-amd64-gui.exe .

      - name: Generate checksums
        working-directory: dist
        run: sha256sum pmdesk-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}" dist/*
          --verify-tag
          --title "PMDesk ${RELEASE_TAG}"
          --generate-notes
